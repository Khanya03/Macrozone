name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, typecheck, and web export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # GitHub sets CI already; keep Expo non-interactive and skip telemetry.
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 is the LTS this Expo SDK 55 app is verified against.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Export web
        run: npx expo export --platform web
